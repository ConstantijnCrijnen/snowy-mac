name: Windows checks

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [main, 'codex/windows-*']
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: windows/global.json
      - name: Test snow physics
        run: dotnet run --configuration Release --project Snowy.Core.Tests
      - name: Build and scan the VM installer
        run: |
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Snowy VM Preview' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddDays(30) -CertStoreLocation Cert:\CurrentUser\My
          $certificatePath = Join-Path $env:RUNNER_TEMP 'snowy-preview-signing.cer'
          try {
            Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
            Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            ./installer/package.ps1 -PreviewCertificateThumbprint $certificate.Thumbprint -UpdateDefenderSignatures -AllowDefenderUnavailable
          } finally {
            Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Windows-preview.msixbundle
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Preview.cer
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Windows-preview.msixbundle.sha256
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Windows-arm64-preview.msix
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Windows-arm64-preview.msix.sha256
          archive: false
          if-no-files-found: error

  install-arm64:
    runs-on: windows-11-arm
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Snowy-*
          path: ${{ runner.temp }}/snowy-install-check
          merge-multiple: true
      - name: Install and verify both preview packages on Windows 11 ARM64
        shell: powershell
        working-directory: ${{ runner.temp }}/snowy-install-check
        run: |
          $identity = 'ArchieAuburn.Snowy.Preview'
          $certificate = Import-Certificate -FilePath .\Snowy-Preview.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          try {
            foreach ($name in @('Snowy-Windows-arm64-preview.msix', 'Snowy-Windows-preview.msixbundle')) {
              $path = (Resolve-Path -LiteralPath $name).Path
              $expected = ((Get-Content -LiteralPath "$name.sha256" -Raw) -split '\s+')[0]
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch for $name." }
              try {
                Add-AppxPackage -Path $path -ErrorAction Stop
                $package = Get-AppxPackage -Name $identity
                if (-not $package -or $package.Architecture -ne 'Arm64') {
                  throw "Windows did not register the ARM64 payload from $name."
                }
                Write-Host "Installed $name as $($package.PackageFullName)"
              } finally {
                Get-AppxPackage -Name $identity | ForEach-Object { Remove-AppxPackage -Package $_.PackageFullName }
              }
            }
          } finally {
            Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)"
          }

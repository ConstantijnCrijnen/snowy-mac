name: Windows checks

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [main, 'codex/windows-*']
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: windows/global.json
      - name: Test snow physics
        run: dotnet run --configuration Release --project Snowy.Core.Tests
      - name: Build and scan the VM installer
        run: |
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Snowy VM Preview' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddDays(30) -CertStoreLocation Cert:\CurrentUser\My
          $certificatePath = Join-Path $env:RUNNER_TEMP 'snowy-preview-signing.cer'
          try {
            Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
            Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            ./installer/package.ps1 -PreviewCertificateThumbprint $certificate.Thumbprint -UpdateDefenderSignatures -AllowDefenderUnavailable
          } finally {
            Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Windows-preview.msixbundle
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Preview.cer
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/windows/*/Snowy-Windows-preview.msixbundle.sha256
          archive: false
          if-no-files-found: error

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.9.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use an existing version tag such as v0.9.0.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source version
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          version="$(plutil -extract CFBundleShortVersionString raw App/Info.plist)"
          test "$RELEASE_TAG" = "v$version"
      - name: Prepare Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Test geometry and physics
        run: swift test
      - name: Build and package
        run: ./scripts/package-release.sh
      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/releases/*.dmg build/releases/*.zip build/releases/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" build/releases/*.dmg build/releases/*.zip build/releases/*.sha256 \
              --verify-tag --title "Snowy $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
